name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ml_universe/**'
      - 'run.py'
      - 'pyproject.toml'
      - 'requirements-windows.txt'
      - 'scripts/**'
      - '.github/workflows/windows-exe.yml'
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Build, test, and package portable EXE
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Publish EXE ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ML_Universe_Windows_x64
          path: dist/ML_Universe_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
