name: Linux quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Python unit / API tests
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check ml_universe/static/app.js
          node --check ml_universe/static/visual_story.js
      - name: Visual semantics contracts (Node)
        run: node scripts/visual_contract.mjs
      - name: API smoke test
        run: |
          python - <<'PYSMOKE'
          import json, threading, urllib.request
          from ml_universe.server import create_server
          server = create_server(0)
          th = threading.Thread(target=server.serve_forever, daemon=True)
          th.start()
          try:
              with urllib.request.urlopen(f'http://127.0.0.1:{server.server_port}/api/health', timeout=10) as response:
                  assert json.load(response)['ok'] is True
          finally:
              server.shutdown()
              server.server_close()
          PYSMOKE

  browser_visual_smoke:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app, Playwright and browser
        run: |
          python -m pip install -e '.[test]' playwright
          python -m playwright install --with-deps chromium
      - name: Visual smoke across all 29 real laboratories
        run: |
          python scripts/visual_smoke.py --chromium auto --nav-start 0 --nav-stop 29
